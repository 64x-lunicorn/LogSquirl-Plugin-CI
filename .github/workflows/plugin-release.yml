name: "Plugin CI Release"

# The CI Release of every LogSquirl plugin, called by the plugin's
# .github/workflows/ci-release.yml (template/) on a v* tag.
#
# A release does not build. It publishes the artifacts of the successful CI
# Build run for the push to the default branch that built the tagged commit:
# the build that passed CI. Those are unsigned; the macOS package is signed
# and notarized here, in a job bound to the plugin repository's `release`
# environment, the only place holding the Apple secrets (its deployment policy
# admits v* tags alone). Then the archives, a checksum file, provenance
# attestations and a Sigstore signature of the checksum file are published,
# and the releases.json entry with the archives' SHA-256 is handed over for
# the catalog.
on:
  workflow_call:
    inputs:
      tag:
        description: "The release tag, for a manual run dispatched from that tag (empty on a tag push)"
        type: string
        required: false
        default: ""
      ci-run-id:
        description: "Run ID of the CI Build push run for the tagged commit (empty: find it)"
        type: string
        required: false
        default: ""

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLATFORMS: linux-x64 macos-arm64 windows-x64

jobs:
  # ── Job 1: Check the tag and fetch the build of the tagged commit ─────
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    # Mostly waiting for a CI Build that is still running for the commit.
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read # the CI Build run and its artifacts
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.commit.outputs.commit }}
      name: ${{ steps.meta.outputs.name }}
      slug: ${{ steps.meta.outputs.slug }}
      library: ${{ steps.meta.outputs.library }}
      api-version: ${{ steps.meta.outputs.api-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Inputs arrive via env, never interpolated into a script.
      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_TAG" ]; then
              echo "::error::A manual release needs the 'tag' input."
              exit 1
            fi
            # The signing job runs in the `release` environment, which admits
            # only v* tags; a run from a branch would fail there.
            if [ "$GITHUB_REF" != "refs/tags/$INPUT_TAG" ]; then
              echo "::error::Dispatch CI Release from the tag itself (Use workflow from: $INPUT_TAG), not from '$GITHUB_REF'."
              exit 1
            fi
            tag=$INPUT_TAG
          else
            tag=$GITHUB_REF_NAME
          fi
          if ! [[ $tag =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            echo "::error::Tag '$tag' is not vX.Y.Z or vX.Y.Z-alpha|beta|rc[.N]"
            exit 1
          fi
          prerelease=false
          [[ $tag != *-* ]] || prerelease=true
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure the tag points to a commit on the default branch
        id: commit
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          commit=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          if ! git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Release tags must be on $DEFAULT_BRANCH. $TAG points to $commit, which is not."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      # The tagged commit must say what the tag says, and the release notes
      # are its CHANGELOG section. Checked before anything is downloaded.
      - name: Check the version and the CHANGELOG section
        id: meta
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          errors=0
          fail() { echo "::error file=$1::$2"; errors=1; }

          json_version=$(jq -r '.version // ""' plugin.json)
          [ "$json_version" = "$VERSION" ] ||
            fail plugin.json "version is '$json_version', the tag says $VERSION; set it before tagging"
          cmake_version=$(sed -n '/^project(/,/)/p' CMakeLists.txt |
            grep -oE 'VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}' | head -1)
          [ "$cmake_version" = "${VERSION%%-*}" ] ||
            fail CMakeLists.txt "project(VERSION $cmake_version), the tag says ${VERSION%%-*}"

          # Exactly one "## [X.Y.Z]" heading; its section runs to the next "## ".
          count=$(grep -cE "^## \[${VERSION//./\\.}\]" CHANGELOG.md || true)
          if [ "$count" -ne 1 ]; then
            fail CHANGELOG.md "expected one '## [$VERSION]' section, found $count"
          else
            mkdir -p meta
            awk -v v="$VERSION" '
              index($0, "## [" v "]") == 1 { on = 1; next }
              on && /^## / { exit }
              on { print }
            ' CHANGELOG.md | sed -e '/./,$!d' > meta/release_notes.md
            [ -n "$(tr -d '[:space:]' < meta/release_notes.md)" ] ||
              fail CHANGELOG.md "the '## [$VERSION]' section is empty"
          fi
          [ "$errors" -eq 0 ] || exit 1

          library=$(jq -r .library plugin.json)
          slug=${library#logsquirl_}
          {
            echo "name=$(jq -r .name plugin.json)"
            echo "library=$library"
            echo "slug=${slug//_/-}"
            echo "api-version=$(jq -r .api_version plugin.json)"
          } >> "$GITHUB_OUTPUT"

      # Only a successful CI Build that ran for a push to the default branch
      # and built the tagged commit may be released: pull request builds come
      # from unreviewed branches, and a build of another commit is not what
      # the tag names. A tag pushed right after the merge finds that run still
      # going; this step waits for it.
      - name: Find the CI Build run of the tagged commit
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          CI_RUN_ID: ${{ inputs.ci-run-id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # $c and $b are jq variables
          filter='[.[] | select(.head_sha == $c and .event == "push" and .head_branch == $b
                                and (.path | endswith("/ci-build.yml")))]'
          deadline=$((SECONDS + 2700))
          while :; do
            if [ -n "$CI_RUN_ID" ]; then
              [[ $CI_RUN_ID =~ ^[0-9]+$ ]] || { echo "::error::ci-run-id must be a number"; exit 1; }
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" --jq '[.]')
            else
              runs=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci-build.yml/runs" \
                -f head_sha="$COMMIT" -f event=push -f branch="$DEFAULT_BRANCH" -f per_page=50 \
                --jq '.workflow_runs')
            fi
            runs=$(jq --arg c "$COMMIT" --arg b "$DEFAULT_BRANCH" "$filter" <<<"$runs")
            run_id=$(jq -r '[.[] | select(.conclusion == "success")] | max_by(.run_number) | .id // empty' <<<"$runs")
            if [ -n "$run_id" ]; then
              echo "CI Build run $run_id built $COMMIT"
              echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if jq -e 'any(.[]; .status != "completed")' <<<"$runs" > /dev/null && [ "$SECONDS" -lt "$deadline" ]; then
              echo "CI Build for $COMMIT is still running; waiting"
              sleep 30
              continue
            fi
            echo "::error::No successful CI Build push run on $DEFAULT_BRANCH for $COMMIT. Re-run CI Build for that commit, then this workflow (or pass its run ID as ci-run-id)."
            jq -r '.[] | "  run \(.id): \(.status) \(.conclusion)"' <<<"$runs"
            exit 1
          done

      # The action checks every download against the artifact's digest.
      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run.outputs.run-id }}
          pattern: plugin-*
          path: build

      - name: Check the build against the tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          LIBRARY: ${{ steps.meta.outputs.library }}
        run: |
          set -euo pipefail
          ls -lR build
          errors=0
          for p in $PLATFORMS; do
            case "$p" in
              linux-*) lib="lib$LIBRARY.so" ;;
              macos-*) lib="lib$LIBRARY.dylib" ;;
              windows-*) lib="$LIBRARY.dll" ;;
            esac
            dir="build/plugin-$p"
            if [ ! -f "$dir/$lib" ] || [ ! -f "$dir/plugin.json" ]; then
              echo "::error::The $p build lacks $lib or plugin.json"
              errors=1
              continue
            fi
            built=$(jq -r .version "$dir/plugin.json")
            if [ "$built" != "$VERSION" ]; then
              echo "::error::The $p build is version $built, the tag says $VERSION"
              errors=1
            fi
          done
          exit $errors

      # The macOS package goes to sign-mac; release takes its signed files.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-macos-arm64
          path: build/plugin-macos-arm64/
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs
          path: |
            build/plugin-linux-x64/
            build/plugin-windows-x64/
            meta/
          if-no-files-found: error

  # ── Job 2: Sign and notarize macOS ─────────────────────────────────────
  # The only job holding the Apple secrets, and only through the plugin
  # repository's `release` environment. A missing secret or identity fails
  # it: a release never ships an unsigned macOS package.
  sign-mac:
    name: Sign macOS
    needs: prepare
    runs-on: macos-15
    environment: release
    # One notarization round trip to Apple.
    timeout-minutes: 45
    permissions: {}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-macos-arm64
          path: pkg

      - name: Require the signing secrets
        env:
          P12_FILE: ${{ secrets.MACOS_P12_FILE }}
          P12_PASSWORD: ${{ secrets.MACOS_P12_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$P12_FILE" ] || missing+=(MACOS_P12_FILE)
          [ -n "$P12_PASSWORD" ] || missing+=(MACOS_P12_PASSWORD)
          [ -n "$NOTARY_APPLE_ID" ] || missing+=(APPLE_ID)
          [ -n "$NOTARY_TEAM_ID" ] || missing+=(APPLE_TEAM_ID)
          [ -n "$NOTARY_PASSWORD" ] || missing+=(APPLE_PASSWORD)
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::The release environment lacks the secrets ${missing[*]}; the macOS package cannot be signed."
            exit 1
          fi

      - name: Import the signing certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.MACOS_P12_FILE }}
          p12-password: ${{ secrets.MACOS_P12_PASSWORD }}

      # Inside out: the bundled framework binaries first, then the plugin.
      - name: Sign
        run: |
          set -euo pipefail
          identity=$(security find-identity -v -p codesigning |
            grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)".*/\1/' || true)
          if [ -z "$identity" ]; then
            echo "::error::No Developer ID Application identity in the imported certificate"
            exit 1
          fi
          echo "Signing as $identity"
          sign() {
            codesign --force --options runtime --timestamp --sign "$identity" "$1"
            codesign --verify --strict --verbose=2 "$1"
          }
          while IFS= read -r -d '' f; do
            sign "$f"
          done < <(find pkg -path '*.framework/Versions/A/*' -type f -print0)
          while IFS= read -r -d '' f; do
            sign "$f"
          done < <(find pkg -maxdepth 1 -name '*.dylib' -type f -print0)

      # Apple records the ticket server-side; the files are unchanged, and
      # Gatekeeper checks online (a bare dylib cannot be stapled).
      - name: Notarize
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/notarize.zip"
          (cd pkg && zip -r -q "$archive" .)
          xcrun notarytool submit "$archive" --wait --output-format json \
            --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" \
            > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          status=$(jq -r '.status // "unknown"' "$RUNNER_TEMP/notary.json")
          id=$(jq -r '.id // empty' "$RUNNER_TEMP/notary.json")
          if [ -n "$id" ]; then
            xcrun notarytool log "$id" \
              --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" || true
          fi
          if [ "$status" != "Accepted" ]; then
            echo "::error::Notarization ended with status $status"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-macos-arm64
          path: pkg/
          if-no-files-found: error

  # ── Job 3: Publish the GitHub Release ──────────────────────────────────
  release:
    name: Publish
    needs: [prepare, sign-mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # Sigstore signature and attestations
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      SLUG: ${{ needs.prepare.outputs.slug }}
      LIBRARY: ${{ needs.prepare.outputs.library }}
    steps:
      # releases.json of the tagged commit, the base for the new entry.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs
          path: inputs

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-macos-arm64
          path: inputs/plugin-macos-arm64

      # -r: a bundled framework is a directory; without it the archive held
      # an empty QtSerialPort.framework/ up to Serial 0.5.0.
      - name: Package
        run: |
          set -euo pipefail
          mkdir -p assets
          for p in $PLATFORMS; do
            zip_name="logsquirl-$SLUG-$VERSION-$p.zip"
            (cd "inputs/plugin-$p" && zip -r -X -q "$GITHUB_WORKSPACE/assets/$zip_name" .)
            echo "== $zip_name"
            unzip -l "assets/$zip_name"
          done
          # No empty file in the macOS archive, bundled frameworks included.
          check="$RUNNER_TEMP/mac"
          mkdir -p "$check"
          unzip -q "assets/logsquirl-$SLUG-$VERSION-macos-arm64.zip" -d "$check"
          if find "$check" -type f -empty | grep .; then
            echo "::error::The macOS archive contains empty files"
            exit 1
          fi

      - name: Write the checksum file and the release notes
        id: assets
        env:
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          set -euo pipefail
          checksum_file="assets/logsquirl-$SLUG-$VERSION-sha256.txt"
          (cd assets && sha256sum --binary -- *.zip) > "$RUNNER_TEMP/sha256.txt"
          mv "$RUNNER_TEMP/sha256.txt" "$checksum_file"
          cat "$checksum_file"
          echo "checksum-file=$checksum_file" >> "$GITHUB_OUTPUT"

          cp inputs/meta/release_notes.md release_notes.md
          template="$RUNNER_TEMP/verifying.md"
          cat > "$template" <<'NOTES'

          ## Verifying downloads

          Every archive is listed in `logsquirl-@SLUG@-@VERSION@-sha256.txt`. That file is
          signed with Sigstore (`logsquirl-@SLUG@-@VERSION@-sha256.txt.sigstore.json`), and
          every archive carries a GitHub build provenance attestation from the shared
          LogSquirl plugin release workflow.

          ```sh
          # 1. Check the signature of the checksum file (needs cosign)
          cosign verify-blob \
            --bundle logsquirl-@SLUG@-@VERSION@-sha256.txt.sigstore.json \
            --certificate-identity-regexp '^https://github\.com/64x-lunicorn/LogSquirl-Plugin-CI/\.github/workflows/plugin-release\.yml@.+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-repository @REPO@ \
            logsquirl-@SLUG@-@VERSION@-sha256.txt

          # 2. Check the archives you downloaded against it
          sha256sum -c logsquirl-@SLUG@-@VERSION@-sha256.txt --ignore-missing

          # 3. Or check one archive's build provenance (needs the GitHub CLI)
          gh attestation verify <file> -R @REPO@ \
            --signer-workflow 64x-lunicorn/LogSquirl-Plugin-CI/.github/workflows/plugin-release.yml
          ```
          NOTES
          section=$(cat "$template")
          section=${section//@SLUG@/$SLUG}
          section=${section//@VERSION@/$VERSION}
          section=${section//@REPO@/$GITHUB_REPOSITORY}
          printf '%s\n' "$section" >> release_notes.md

      # A draft first: attestations and signature are made while the release
      # is invisible, and a failure leaves a draft, not a public release
      # without them. A re-run reuses the draft for the tag.
      - name: Create draft release # zizmor: ignore[superfluous-actions]
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.name }} ${{ needs.prepare.outputs.tag }}"
          body_path: release_notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          draft: true
          files: assets/*
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless, bound to this workflow's identity. Written outside assets/,
      # so it is not (and cannot be) listed in the checksum file.
      - name: Sign the checksum file
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKSUM_FILE: ${{ steps.assets.outputs.checksum-file }}
        run: |
          set -euo pipefail
          bundle="$RUNNER_TEMP/${CHECKSUM_FILE##*/}.sigstore.json"
          cosign sign-blob --yes --bundle "$bundle" "$CHECKSUM_FILE"
          gh release upload "$TAG" "$bundle" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          latest=true
          [ "$PRERELEASE" != "true" ] || latest=false
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest="$latest" --jq .html_url

      # The catalog reads releases.json from the default branch, and the host
      # checks each download against its sha256. Workflows do not push or open
      # pull requests here, so the updated file goes to the summary and an
      # artifact for the maintainer to commit.
      - name: Hand over the releases.json entry
        env:
          API_VERSION: ${{ needs.prepare.outputs.api-version }}
          NAME: ${{ needs.prepare.outputs.name }}
        run: |
          set -euo pipefail
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          sha() { sha256sum "assets/logsquirl-$SLUG-$VERSION-$1.zip" | cut -d' ' -f1; }
          entry=$(jq -n --arg v "$VERSION" --argjson api "$API_VERSION" --arg notes "$NAME $TAG" \
            --arg base "$base" --arg slug "$SLUG" \
            --arg mac "$(sha macos-arm64)" --arg linux "$(sha linux-x64)" --arg win "$(sha windows-x64)" '
            def asset($platform; $suffix; $sha):
              {platform: $platform,
               download_url: "\($base)/logsquirl-\($slug)-\($v)-\($suffix).zip",
               sha256: $sha};
            {version: $v, api_version: $api, release_notes: $notes,
             assets: [asset("macos"; "macos-arm64"; $mac),
                      asset("linux"; "linux-x64"; $linux),
                      asset("windows"; "windows-x64"; $win)]}')
          mkdir -p catalog
          jq --argjson e "$entry" '.releases = [$e] + [.releases[] | select(.version != $e.version)]' \
            releases.json > catalog/releases.json
          {
            echo "## releases.json"
            echo
            echo "Commit this entry (or the \`releases-json\` artifact) to the default branch so the catalog offers $VERSION:"
            echo
            echo '```json'
            echo "$entry"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: releases-json
          path: catalog/releases.json
          if-no-files-found: error
