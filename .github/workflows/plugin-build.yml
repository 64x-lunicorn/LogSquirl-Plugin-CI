name: "Plugin CI Build"

# The CI Build of every LogSquirl plugin. A plugin's .github/workflows/ci-build.yml
# (template/, identical in every plugin) calls this workflow; everything that
# differs between plugins comes from the plugin's own files:
#
#   plugin.json              id, version, library, type, api_version, icon
#   .github/plugin-ci.json   host_ref (the LogSquirl release the plugin is built
#                            against), qt_modules, bundle_qt_frameworks
#
# host_ref decides the Qt version and the plugin API header: a plugin is built
# with the Qt of that LogSquirl release, and its vendored logsquirl_plugin_api.h
# must be that release's header byte for byte.
#
# The packages are unsigned. CI Release (plugin-release.yml) publishes exactly
# these artifacts of the push run on the default branch for the tagged commit;
# macOS signing happens there, in the `release` environment. So nothing here
# needs a secret.
on:
  workflow_call:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  HOST_REPO: 64x-lunicorn/LogSquirl

jobs:
  # -----------------------------------------------------------------------
  # Setup — read and check the plugin's metadata against itself and against
  # the LogSquirl release it targets. The build jobs take their inputs from
  # here, so a plugin with inconsistent metadata never builds.
  # -----------------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-24.04
    # jq over two files and two small API reads.
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      library: ${{ steps.meta.outputs.library }}
      type: ${{ steps.meta.outputs.type }}
      icon: ${{ steps.meta.outputs.icon }}
      qt-version: ${{ steps.host.outputs.qt-version }}
      qt-modules: ${{ steps.meta.outputs.qt-modules }}
      bundle-qt-frameworks: ${{ steps.meta.outputs.bundle-qt-frameworks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check plugin.json and .github/plugin-ci.json
        id: meta
        run: |
          set -euo pipefail
          errors=0
          fail() { echo "::error file=$1::$2"; errors=1; }

          for f in plugin.json .github/plugin-ci.json; do
            if ! jq -e 'type == "object"' "$f" > /dev/null 2>&1; then
              echo "::error file=$f::$f is missing or not a JSON object"
              exit 1
            fi
          done

          id=$(jq -r '.id // ""' plugin.json)
          version=$(jq -r '.version // ""' plugin.json)
          library=$(jq -r '.library // ""' plugin.json)
          type=$(jq -r '.type // ""' plugin.json)
          icon=$(jq -r '.icon // ""' plugin.json)

          # The catalog's identifier rule (LogSquirl-Plugins validate.yml).
          [[ $id =~ ^[a-z][a-z0-9]*(\.[a-z][a-z0-9]*){2,}$ ]] ||
            fail plugin.json "id '$id' is not a reverse-DNS identifier"
          [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]] ||
            fail plugin.json "version '$version' is not X.Y.Z or X.Y.Z-alpha|beta|rc[.N]"
          # The release archives are named after the library: logsquirl_foo_bar
          # becomes logsquirl-foo-bar-<version>-<platform>.zip.
          [[ $library =~ ^logsquirl_[a-z0-9]+(_[a-z0-9]+)*$ ]] ||
            fail plugin.json "library '$library' must be logsquirl_<name> (lower case, digits, underscores)"
          case "$type" in
            ui | converter) ;;
            *) fail plugin.json "type '$type' must be 'ui' or 'converter'" ;;
          esac
          if [ -n "$icon" ] && [ ! -f "$icon" ]; then
            fail plugin.json "icon '$icon' does not exist"
          fi

          # CMake cannot carry a pre-release suffix, so project(VERSION) holds
          # the plugin.json version without it.
          cmake_version=$(sed -n '/^project(/,/)/p' CMakeLists.txt |
            grep -oE 'VERSION[[:space:]]+[0-9]+\.[0-9]+\.[0-9]+' | awk '{print $2}' | head -1)
          if [ "$cmake_version" != "${version%%-*}" ]; then
            fail CMakeLists.txt "project(VERSION $cmake_version) does not match plugin.json version $version"
          fi

          host_ref=$(jq -r '.host_ref // ""' .github/plugin-ci.json)
          [[ $host_ref =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] ||
            fail .github/plugin-ci.json "host_ref '$host_ref' must be a LogSquirl release tag (vYY.MM.PATCH)"
          qt_modules=$(jq -r '(.qt_modules // []) | join(" ")' .github/plugin-ci.json)
          bundle=$(jq -r '(.bundle_qt_frameworks // []) | join(" ")' .github/plugin-ci.json)
          for m in $qt_modules; do
            [[ $m =~ ^qt[a-z0-9]+$ ]] || fail .github/plugin-ci.json "qt_modules entry '$m' is not an aqt module name (e.g. qtserialport)"
          done
          for fw in $bundle; do
            [[ $fw =~ ^Qt[A-Za-z0-9]+$ ]] || fail .github/plugin-ci.json "bundle_qt_frameworks entry '$fw' is not a Qt framework name (e.g. QtSerialPort)"
          done

          [ "$errors" -eq 0 ] || exit 1
          echo "$id $version: library $library, type $type, host $host_ref"
          {
            echo "library=$library"
            echo "type=$type"
            echo "icon=$icon"
            echo "host-ref=$host_ref"
            echo "qt-modules=$qt_modules"
            echo "bundle-qt-frameworks=$bundle"
          } >> "$GITHUB_OUTPUT"

      # The vendored header is the host release's, byte for byte, and
      # api_version is the one it declares. The Qt version is the one that
      # release was built with: a bundled Qt module has to match the host's Qt.
      - name: Check against LogSquirl ${{ steps.meta.outputs.host-ref }}
        id: host
        env:
          GH_TOKEN: ${{ github.token }}
          HOST_REF: ${{ steps.meta.outputs.host-ref }}
        run: |
          set -euo pipefail
          host_file() {
            gh api -H "Accept: application/vnd.github.raw" "repos/$HOST_REPO/contents/$1?ref=$HOST_REF"
          }
          header="$RUNNER_TEMP/logsquirl_plugin_api.h"
          host_file src/plugins/include/logsquirl_plugin_api.h > "$header"
          if ! cmp -s "$header" include/logsquirl_plugin_api.h; then
            echo "::error file=include/logsquirl_plugin_api.h::not the header of LogSquirl $HOST_REF; refresh it with LogSquirl-Plugin-CI's scripts/sync-plugin.sh"
            diff -u include/logsquirl_plugin_api.h "$header" | head -80 || true
            exit 1
          fi

          host_api=$(awk '$1 == "#define" && $2 == "LOGSQUIRL_PLUGIN_API_VERSION" {print $3}' "$header")
          api=$(jq -r '.api_version // ""' plugin.json)
          if [ "$api" != "$host_api" ]; then
            echo "::error file=plugin.json::api_version '$api' is not LogSquirl $HOST_REF's LOGSQUIRL_PLUGIN_API_VERSION $host_api"
            exit 1
          fi

          # LogSquirl's build images carry the Qt version as ENV QT_VERSION.
          qt=$(host_file docker/ubuntu24.04/Dockerfile | sed -n 's/^ENV QT_VERSION=\([0-9.]*\)$/\1/p' | head -1)
          if ! [[ $qt =~ ^6\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Cannot read the Qt version of LogSquirl $HOST_REF from docker/ubuntu24.04/Dockerfile; update plugin-build.yml in LogSquirl-Plugin-CI"
            exit 1
          fi
          echo "LogSquirl $HOST_REF: plugin API $host_api, Qt $qt"
          echo "qt-version=$qt" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # Format — the tree matches .clang-format, with the clang-format version
  # and hashes of .github/requirements/clang-format.txt (both from template/).
  # The vendored plugin API header is LogSquirl's, byte for byte, and formatted
  # as that release was; it is left out.
  # -----------------------------------------------------------------------
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install clang-format
        run: |
          pip install --require-hashes --only-binary :all: -r .github/requirements/clang-format.txt

      - name: Check formatting
        run: |
          set -euo pipefail
          clang-format --version
          status=0
          while IFS= read -r -d '' f; do
            if ! diff -u "$f" <(clang-format "$f") > "$RUNNER_TEMP/format.diff"; then
              echo "::error file=$f::not clang-format clean"
              cat "$RUNNER_TEMP/format.diff"
              status=1
            fi
          done < <(git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' \
            ':(exclude)include/logsquirl_plugin_api.h')
          if [ "$status" -ne 0 ]; then
            echo "::error::Run clang-format -i on the files above (clang-format $(clang-format --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+'))"
          fi
          exit $status

  # -----------------------------------------------------------------------
  # Build — build, test and package the plugin on every platform LogSquirl
  # ships. The artifact is what the release archive for that platform holds.
  # -----------------------------------------------------------------------
  build:
    name: ${{ matrix.name }}
    needs: setup
    runs-on: ${{ matrix.os }}
    # Qt comes from the action's cache; a cold install plus build and tests
    # stays well below this.
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
            qt-arch: linux_gcc_64
            platform: linux-x64
          - name: macOS arm64
            os: macos-15
            qt-arch: clang_64
            platform: macos-arm64
          - name: Windows x64
            os: windows-2025
            qt-arch: win64_msvc2022_64
            platform: windows-x64
    env:
      LIBRARY: ${{ needs.setup.outputs.library }}
      PLUGIN_TYPE: ${{ needs.setup.outputs.type }}
      ICON: ${{ needs.setup.outputs.icon }}
      BUNDLE_QT_FRAMEWORKS: ${{ needs.setup.outputs.bundle-qt-frameworks }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Qt
        uses: jurplel/install-qt-action@bcb88e3bed2e992f5f9e24c0f9e364a231d278eb # v4.4.0
        with:
          version: ${{ needs.setup.outputs.qt-version }}
          arch: ${{ matrix.qt-arch }}
          modules: ${{ needs.setup.outputs.qt-modules }}
          cache: true

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@3b1f8f94a2f8254bd26914c4ab9474d4f0015f67 # v6

      - name: Configure
        run: cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      # --no-tests=error: a plugin without tests fails instead of passing.
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Name the library
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) lib="lib$LIBRARY.so" ;;
            macOS) lib="lib$LIBRARY.dylib" ;;
            Windows) lib="$LIBRARY.dll" ;;
          esac
          if [ ! -f "build/$lib" ]; then
            echo "::error::build/$lib not found; the CMake target must be named after plugin.json's library"
            ls build
            exit 1
          fi
          echo "LIB_FILE=$lib" >> "$GITHUB_ENV"

      # The host resolves these names with QLibrary::resolve; a missing one
      # means the plugin does not load.
      - name: Check the exported entry points
        run: |
          set -euo pipefail
          required=(logsquirl_plugin_get_info logsquirl_plugin_init logsquirl_plugin_shutdown)
          if [ "$PLUGIN_TYPE" = converter ]; then
            required+=(logsquirl_converter_get_extensions logsquirl_converter_convert)
          fi
          case "$RUNNER_OS" in
            Linux) exports=$(nm -D --defined-only "build/$LIB_FILE" | awk '{print $NF}') ;;
            macOS) exports=$(nm -gU "build/$LIB_FILE" | awk '{print $NF}' | sed 's/^_//') ;;
            # -exports, not /exports: Git Bash would rewrite /exports into a path.
            Windows) exports=$(dumpbin -nologo -exports "build/$LIB_FILE" | awk '{print $NF}') ;;
          esac
          missing=0
          for sym in "${required[@]}"; do
            if grep -qx "$sym" <<<"$exports"; then
              echo "ok       $sym"
            else
              echo "::error::$LIB_FILE does not export $sym"
              missing=1
            fi
          done
          exit $missing

      - name: Stage the package
        run: |
          set -euo pipefail
          mkdir -p staging
          cp "build/$LIB_FILE" plugin.json staging/
          if [ -n "$ICON" ]; then
            cp "$ICON" staging/
          fi

      # The Qt path of the runner is baked into the dylib and does not exist
      # on user machines. The plugin resolves Qt from the host app bundle
      # (Contents/PlugIns/<id>/ -> Contents/Frameworks/) and bundled
      # frameworks from its own directory.
      - name: Fix the macOS rpaths
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dylib="staging/$LIB_FILE"
          # sort -u: otool lists the load commands of every slice of a
          # universal binary, and one delete removes the rpath from all.
          for rp in $(otool -l "$dylib" | awk '/cmd LC_RPATH/{found=1} found && /path /{print $2; found=0}' | sort -u); do
            install_name_tool -delete_rpath "$rp" "$dylib"
          done
          install_name_tool -add_rpath @loader_path/../../../Frameworks "$dylib"
          install_name_tool -add_rpath @loader_path "$dylib"
          otool -l "$dylib" | grep -A2 LC_RPATH

      # Qt modules the host app does not ship travel with the plugin: only the
      # framework binary, in a Versions/A layout without symlinks so it
      # survives the ZIP archive. QtCore and QtWidgets are the host's.
      - name: Bundle Qt frameworks
        if: runner.os == 'macOS' && env.BUNDLE_QT_FRAMEWORKS != ''
        run: |
          set -euo pipefail
          # Qt6_DIR is .../lib/cmake/Qt6; the frameworks are in .../lib.
          qt6_dir=$(grep '^Qt6_DIR:' build/CMakeCache.txt | cut -d= -f2)
          qt_lib=$(cd "$qt6_dir/../.." && pwd)
          for fw in $BUNDLE_QT_FRAMEWORKS; do
            src=""
            for candidate in "$qt_lib/$fw.framework/Versions/A/$fw" "$qt_lib/$fw.framework/$fw"; do
              if [ -f "$candidate" ]; then src=$candidate; break; fi
            done
            if [ -z "$src" ]; then
              echo "::error::$fw.framework not found in $qt_lib; is its module in qt_modules?"
              exit 1
            fi
            dest="staging/$fw.framework/Versions/A"
            mkdir -p "$dest"
            # Qt's frameworks are universal; the plugin is arm64 only.
            if lipo -archs "$src" | grep -qw x86_64; then
              lipo "$src" -thin arm64 -output "$dest/$fw"
            else
              cp "$src" "$dest/$fw"
            fi
            for rp in $(otool -l "$dest/$fw" | awk '/cmd LC_RPATH/{found=1} found && /path /{print $2; found=0}' | sort -u); do
              install_name_tool -delete_rpath "$rp" "$dest/$fw"
            done
            echo "Bundled $fw ($(wc -c < "$dest/$fw") bytes)"
          done

      # Nothing in the package may point into the runner: such a path works in
      # CI and fails on every user machine.
      - name: Check the package for runner paths
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            if file "$f" | grep -q 'Mach-O' && otool -lL "$f" | grep -E '/Users/runner|/opt/hostedtoolcache|/Users/[^/]+/work'; then
              echo "::error::$f references a runner path"
              status=1
            fi
          done < <(find staging -type f -print0)
          exit $status

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ matrix.platform }}
          path: staging/
          if-no-files-found: error

  # -----------------------------------------------------------------------
  # CI passed — the one check a branch ruleset requires.
  # -----------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [setup, format, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          if ! jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" > /dev/null; then
            echo "::error::A CI job did not succeed"
            exit 1
          fi
