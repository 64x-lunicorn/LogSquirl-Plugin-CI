name: "Plugin Drift"

# Every plugin in the matrix below has the shared setup of template/ on its default
# branch (scripts/sync-plugin.sh --check). Which release a plugin pins is not
# drift, Dependabot moves that; a changed shared file or an extra workflow is.
on:
  push:
    branches: [main]
  schedule:
    - cron: '43 5 * * 1'
  workflow_dispatch:

concurrency:
  group: plugin-drift
  cancel-in-progress: true

permissions: {}

jobs:
  drift:
    name: ${{ matrix.repo }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        repo:
          - 64x-lunicorn/LogSquirl-CustomFooter
          - 64x-lunicorn/LogSquirl-Logcat
          - 64x-lunicorn/LogSquirl-Serial
          - 64x-lunicorn/LogSquirl-tcpdump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          path: plugin
          persist-credentials: false

      - name: Check for drift
        run: scripts/sync-plugin.sh --check plugin
